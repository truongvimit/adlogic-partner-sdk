// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    apply from: 'versions.gradle'
    
    repositories {
        google()
        mavenCentral()

    }
    dependencies {
        classpath "com.android.tools.build:gradle:$android_gradle_plugin_version"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "org.jetbrains.kotlin:kotlin-serialization:$kotlin_version"
        classpath "com.google.dagger:hilt-android-gradle-plugin:$hilt_version"
        classpath "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin:$ksp_version"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files

        // crashlytics
        classpath "com.google.gms:google-services:$google_services_version"
        classpath "com.google.firebase:firebase-crashlytics-gradle:$firebase_crashlytics_gradle_version"
    }
}

apply from: 'versions.gradle'

allprojects {
    // Maven coordinates for the publishable library modules — the eight listed in jitpack.yml
    // (:trackkit*, :ads, :billingkit, :adtracer, :onboardkitorigin, :paykit*).
    //
    // JitPack exports VERSION as the tag/branch it is building, so reading the env var keeps the
    // published version in lockstep with the git tag without touching this file on every release.
    // Note: do NOT use findProperty('version') here — project.version defaults to the string
    // "unspecified" rather than null, so an elvis fallback on it would never trigger.
    group = 'com.github.truongvimit'
    version = System.getenv('VERSION') ?: '1.0.0-SNAPSHOT'

    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
        maven { url 'https://repo1.maven.org/maven2' }

        maven {
            url 'https://artifact.bytedance.com/repository/pangle/'
        }
        maven { url 'https://android-sdk.is.com/' }

        maven {
            url = uri("https://dl-maven-android.mintegral.com/repository/mbridge_android_sdk_oversea")
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}