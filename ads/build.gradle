apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'maven-publish'

android {
    compileSdk compile_sdk_version

    defaultConfig {
        minSdk min_sdk_version
        targetSdk target_sdk_version
        consumerProguardFiles "consumer-rules.pro"
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
            withJavadocJar()
        }
    }

    testOptions {
        // AdConfigParser reads through android.util.JsonReader, so the parser tests need a real
        // framework class rather than a stub that returns defaults.
        unitTests.returnDefaultValues = true
        unitTests.includeAndroidResources = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    kotlinOptions {
        jvmTarget = '1.8'
        freeCompilerArgs += ["-Xskip-metadata-version-check"]
    }

    namespace "com.ads.module"
}

dependencies {
    // api, not implementation: partner apps call Tracker / AdFormat through :ads.
    api project(':trackkit')

    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation "com.google.android.material:material:$androidx_material_version"

    // api, not implementation: ShimmerFrameLayout is exposed through NativeAdShimmer.from().
    api "com.facebook.shimmer:shimmer:$shimmer_version"
    implementation "androidx.lifecycle:lifecycle-runtime:$androidx_lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-process:$androidx_lifecycle_version"

    // api, not implementation: StateFlow<AdNativeState/AdBannerState> is helper public API
    api "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutines_version"

    // Admob
    implementation "com.google.android.gms:play-services-ads:$play_services_ads_version"
    implementation 'com.google.android.gms:play-services-ads-identifier:18.3.0'

    // Mediation
    implementation 'com.google.ads.mediation:facebook:6.21.0.3'
    implementation 'com.google.ads.mediation:applovin:13.6.2.0'
    implementation 'com.google.ads.mediation:vungle:7.7.4.0'
    implementation 'com.google.ads.mediation:pangle:8.0.0.5.0'
    implementation 'com.google.ads.mediation:mintegral:17.1.61.0'
    implementation 'com.unity3d.ads:unity-ads:4.18.1'
    implementation 'com.google.ads.mediation:unity:4.18.0.0'
    implementation 'com.google.ads.mediation:ironsource:9.4.2.0'

    // Facebook SDK: only FacebookSdk.setClientToken/sdkInitialize are used, so core is enough —
    // the umbrella artifact also pulls login/share/messenger.
    implementation 'com.facebook.android:facebook-core:18.2.3'

    // Adjust
    implementation 'com.adjust.sdk:adjust-android:5.7.0'
    implementation 'com.android.installreferrer:installreferrer:2.2'

    // Sdp & Ssp
    implementation 'com.intuit.sdp:sdp-android:1.1.1'
    implementation 'com.intuit.ssp:ssp-android:1.1.1'

    // TODO(consent): no UMP code lives in :ads — this api export only exists so the template's
    // ConsentHandler compiles. Drops together with the UMP flow move into :onboardkitorigin.
    api 'com.google.android.ump:user-messaging-platform:4.0.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.13'
    testImplementation 'androidx.test:core:1.6.1'
}

// AGP creates the 'release' software component late, so the publication must be configured
// inside afterEvaluate. groupId and version are inherited from the root project.
afterEvaluate {
    publishing {
        publications {
            create("release", MavenPublication) {
                from(components["release"])
                artifactId = "ads"
            }
        }
    }
}
