plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'maven-publish'
}

android {
    namespace 'io.trackkit.firebase'
    compileSdk compile_sdk_version

    defaultConfig {
        minSdk min_sdk_version
        consumerProguardFiles "consumer-rules.pro"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
        }
    }
}

// One vendor per sink module: this one owns Firebase and nothing else, so :ads and
// :onboardkitorigin can keep depending on the vendor-free :trackkit contract.
dependencies {
    api project(':trackkit')

    // The BOM is exported so a consumer that adds this sink gets its other Firebase artifacts
    // aligned to the same train. :ads pins firebase-analytics 23.2.0 explicitly, which is higher
    // than the BOM's 23.0.0 and therefore wins conflict resolution in the app build.
    api platform("com.google.firebase:firebase-bom:$firebase_bom_version")
    api 'com.google.firebase:firebase-analytics'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.13'
    testImplementation 'androidx.test:core:1.6.1'
}

afterEvaluate {
    publishing {
        publications {
            create("release", MavenPublication) {
                from(components["release"])
                artifactId = "trackkit-firebase"
            }
        }
    }
}
