# JitPack build configuration.
#
# JDK 17 is required: :adtracer and :onboardkitorigin compile against Java 17 bytecode,
# and AGP 8.12 itself refuses to run on anything older than 17.
jdk:
  - openjdk17

# Only the publishable library modules are built. :app is deliberately excluded — it needs a
# signing config and a real google-services.json, and consumers never need it. So is
# :sample-paywall-only, which exists to prove the billing split compiles and is never consumed.
# JitPack exports VERSION as the tag being built; the root build.gradle reads it.
#
# This list must name every module with a `publishing` block, and nothing else. A module missing
# here still appears in the README's dependency table, so a partner declares an artifact that was
# never published; a module named here but absent from settings.gradle fails the whole build and
# publishes nothing at all.
#
# :trackkit is not optional even though no consumer asks for it by name: :ads and
# :onboardkitorigin declare `api project(':trackkit')`, so their POMs carry a hard dependency on
# it. Leaving it out would publish two SDKs pointing at an artifact that does not exist.
#
# :suite-firebase carries the same obligation the other way: it declares `api project(':trackkit')`
# and is the only source of FirebaseSink, FirebaseAdConfigSource and FirebaseConfigSource, so the
# ad config, the paywall document and GA4 all stop working without it. It replaced the former
# :trackkit-firebase and :paykit-firebase, which no longer exist.
#
# :billingkit joined the list when the billing engine left :ads: :paykit declares
# `implementation project(':billingkit')`, so its POM points at the billingkit artifact.
install:
  - ./gradlew :trackkit:publishToMavenLocal :suite-firebase:publishToMavenLocal :ads:publishToMavenLocal :billingkit:publishToMavenLocal :adtracer:publishToMavenLocal :onboardkitorigin:publishToMavenLocal :paykit:publishToMavenLocal -x test --no-daemon --stacktrace
