# JitPack build configuration.
#
# JDK 17 is required: :adtracer and :onboardkitorigin compile against Java 17 bytecode,
# and AGP 8.12 itself refuses to run on anything older than 17.
jdk:
  - openjdk17

# Only the publishable library modules are built. :app is deliberately excluded — it needs a
# signing config and a real google-services.json, and consumers never need it.
# JitPack exports VERSION as the tag being built; the root build.gradle reads it.
#
# :trackkit is not optional here even though no consumer asks for it by name: :ads and
# :onboardkitorigin declare `api project(':trackkit')`, so their POMs carry a hard dependency on
# it. Leaving it out of this list would publish two SDKs that point at an artifact that does not
# exist, and both would fail to resolve.
#
# :paykit carries the same trap one level further out: :paykit-firebase declares
# `api project(':paykit')`, so publishing the adapter without the port would resolve to nothing.
#
# :billingkit joined the list when the billing engine left :ads: :paykit declares
# `implementation project(':billingkit')`, so its POM points at the billingkit artifact.
install:
  - ./gradlew :trackkit:publishToMavenLocal :trackkit-firebase:publishToMavenLocal :ads:publishToMavenLocal :billingkit:publishToMavenLocal :adtracer:publishToMavenLocal :onboardkitorigin:publishToMavenLocal :paykit:publishToMavenLocal :paykit-firebase:publishToMavenLocal -x test --no-daemon --stacktrace
