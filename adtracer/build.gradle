plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'maven-publish'
}

android {
    namespace 'io.adtracer'
    compileSdk compile_sdk_version

    defaultConfig {
        minSdk min_sdk_version
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
        }
    }
}

// Zero dependencies by design: the module must never shift versions of the host app
dependencies {
}

// AGP creates the 'release' software component late, so the publication must be configured
// inside afterEvaluate. groupId and version are inherited from the root project.
afterEvaluate {
    publishing {
        publications {
            create("release", MavenPublication) {
                from(components["release"])
                artifactId = "adtracer"
            }
        }
    }
}
