plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'com.google.devtools.ksp'
    id 'dagger.hilt.android.plugin'
    id 'kotlin-parcelize'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

android {
    compileSdk compile_sdk_version

    defaultConfig {
        applicationId "com.itg.template"
        minSdkVersion min_sdk_version
        targetSdk target_sdk_version
        versionCode 100
        versionName "1.0.0"

        def formattedDate = new Date().format('MM.dd.yyyy')
        archivesBaseName = "ITG_Base_Project_v${versionName}_v${versionCode}_${formattedDate}"
    }
    bundle {

        language {
            enableSplit = false
        }

    }

    buildTypes {
        def BOOLEAN = "boolean"
        def STRING = "String"
        def TRUE = "true"
        def FALSE = "false"
        def DEV_MODE = "DEV_MODE"

        debug {
            buildConfigField "String", "email_feedback", "\"glorymobile88@gmail.com\""
            manifestPlaceholders = [app_id: "ca-app-pub-3940256099942544~3347511713"]

            buildConfigField "String", "ERAIN_STUDIO_VERSION", "\"$erain_studio_version\""
            buildConfigField "String", "PLAY_SERVICES_ADS_VERSION", "\"$play_services_ads_version\""
            buildConfigField "String", "GDPR_MODULE_VERSION", "\"$module_update_gdpr_version\""

            buildConfigField "Boolean", "build_debug", "true"
            buildConfigField(BOOLEAN, DEV_MODE, TRUE)
            versionNameSuffix '-dev'
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            firebaseCrashlytics {
                mappingFileUploadEnabled false
            }
        }

        release {
            // ADS CONFIG BEGIN (required)
            buildConfigField "String", "email_feedback", "\"glorymobile88@gmail.com\""
            manifestPlaceholders = [app_id: "ca-app-pub-7208941695689653~1614717305"]

            buildConfigField "String", "ERAIN_STUDIO_VERSION", "\"$erain_studio_version\""
            buildConfigField "String", "PLAY_SERVICES_ADS_VERSION", "\"$play_services_ads_version\""
            buildConfigField "String", "GDPR_MODULE_VERSION", "\"$module_update_gdpr_version\""

            buildConfigField "Boolean", "build_debug", "false"
            buildConfigField(BOOLEAN, DEV_MODE, FALSE)
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            firebaseCrashlytics {
                mappingFileUploadEnabled true
            }
            signingConfig signingConfigs.debug
        }
    }
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += ["-Xskip-metadata-version-check"]
    }

    buildFeatures {
        dataBinding = true
        viewBinding = true
        buildConfig = true
    }
    namespace 'com.itg.template'
}

dependencies {
    // AndroidX Core
    implementation "androidx.core:core-ktx:$androidx_core_ktx_version"
    implementation "androidx.appcompat:appcompat:$androidx_appcompat_version"
    implementation "com.google.android.material:material:$androidx_material_version"
    implementation "androidx.recyclerview:recyclerview:$androidx_recyclerview_version"
    implementation "androidx.multidex:multidex:$androidx_multidex_version"

    // Hilt
    implementation "com.google.dagger:hilt-android:$hilt_version"
    ksp "com.google.dagger:hilt-compiler:$hilt_version"

    // Retrofit for networking
    // define a BOM and its version
    implementation(platform("com.squareup.okhttp3:okhttp-bom:$okhttp_bom_version"))

    // define any required OkHttp artifacts without version
    implementation("com.squareup.okhttp3:okhttp")
    implementation("com.squareup.okhttp3:logging-interceptor")
    implementation "com.squareup.retrofit2:retrofit:$retrofit_version"
    implementation "com.jakewharton.retrofit:retrofit2-kotlin-coroutines-adapter:$retrofit_kotlin_coroutines_adapter_version"
    implementation "com.squareup.retrofit2:converter-moshi:$retrofit_version"
    implementation "com.github.skydoves:sandwich:$sandwich_version"
    implementation "com.github.skydoves:sandwich-retrofit:$sandwich_version"

    // Moshi
    ksp "com.squareup.moshi:moshi-kotlin-codegen:$moshi_version"
    implementation "com.squareup.moshi:moshi:$moshi_version"
    implementation "com.squareup.moshi:moshi-kotlin:$moshi_version"
    implementation "com.squareup.moshi:moshi-adapters:$moshi_version"

    // Coroutine
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$coroutines_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutines_version"

    // Glide
    implementation "com.github.bumptech.glide:glide:$glide_version"
    ksp "com.github.bumptech.glide:compiler:$glide_version"

    // Room
    implementation "androidx.room:room-runtime:$room_version"
    ksp "androidx.room:room-compiler:$room_version"
    // optional - Kotlin Extensions and Coroutines support for Room
    implementation "androidx.room:room-ktx:$room_version"

    // Timber
    implementation "com.jakewharton.timber:timber:$timber_version"

    // Leak Canary
//    debugImplementation "com.squareup.leakcanary:leakcanary-android:$leakcanary_version"

    // Permissions
    implementation "com.vmadalin:easypermissions-ktx:$easypermissions_ktx_version"
    implementation "io.github.impeterwayne:xxpermission-ktx:$xxpermission_ktx_version"

    // UI Libraries
    implementation "de.hdodenhof:circleimageview:$circleimageview_version"

    // Firebase
    implementation platform("com.google.firebase:firebase-bom:$firebase_bom_version")
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-config'

    // Ads (local module thay cho com.github.trongluan99:ERain-Studio)
    implementation project(':ads')

    // Billing engine — split out of :ads; this app sells IAP, so it declares the module itself
    implementation project(':billingkit')

    // OnboardKit — first-open flow (splash, language, onboarding, question)
    implementation project(':onboardkitorigin')

    // Trackkit — single analytics fan-out. The core is vendor-free; each sink brings its own SDK.
    implementation project(':trackkit')
    implementation project(':trackkit-firebase')

    // PayKit — paywall UI over the billing engine in :billingkit. Same port/adapter split as
    // Trackkit: the core reads a vendor-free PaywallConfigSource, -firebase is the only adapter.
    implementation project(':paykit')
    implementation project(':paykit-firebase')

    // Debug-only ad lifecycle tracker + embedded dashboard; absent from release builds
    debugImplementation project(':adtracer')
    // DevConfig still drags in the published ERain-Studio AAR, whose classes are the same
    // com.ads.module.* types this project builds locally as :ads. R8 fails on the duplicate
    // (com.ads.module.ump.IAdConsentCallBack$DefaultImpls). The local module wins.
    implementation('com.github.Infinity-Technologies-Global:DevConfig:1.0.7-partner') {
        exclude group: 'com.github.trongluan99', module: 'ERain-Studio'
    }
    implementation "com.github.Infinity-Technologies-Global:Module-Update-GDPR:$module_update_gdpr_version"
    implementation "com.google.android.play:review-ktx:$play_review_ktx_version"
    implementation "com.facebook.shimmer:shimmer:$shimmer_version"
    implementation "com.google.android.gms:play-services-ads:$play_services_ads_version"

    // Lifecycle
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$androidx_lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$androidx_lifecycle_version"
    implementation "androidx.fragment:fragment-ktx:$androidx_fragment_ktx_version"

    // Lottie
    implementation "com.airbnb.android:lottie:$lottie_version"

    // Rate
    implementation "com.github.ome450901:SimpleRatingBar:$simpleratingbar_version"

    // Media
    implementation "androidx.media3:media3-exoplayer:$media3_exoplayer_version"
    implementation "androidx.media3:media3-ui:$media3_ui_version"

    // BlurView
    implementation "com.github.Dimezis:BlurView:$blurview_version"

    // Crash Module
    implementation project(':crash_screen')

    // Unit Test
    testImplementation 'junit:junit:4.13.2'
}
