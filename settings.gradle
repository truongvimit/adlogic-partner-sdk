include ':app'
rootProject.name = "adlogic-partner-sdk"
include ':crash_screen'
include ':ads'
include ':onboardkitorigin'
include ':adtracer'

// Analytics: vendor-free contract. Adjust is deliberately absent — the MMP lives in :ads.
include ':trackkit'

// The suite's single Firebase adapter: analytics sink, paywall config source, ad config source,
// and the one Remote Config client all three fetch through. :paykit and :ads are compileOnly, so
// a partner who wants only the analytics sink does not inherit the paywall UI or the ad stack.
include ':suite-firebase'

// Billing: the Play Billing engine, split out of :ads so an IAA-only partner ships no billing
// classes and an IAP-only partner ships no GMA. Same com.ads.module.billing FQNs as before —
// existing imports keep compiling; IAP partners just add this one module.
include ':billingkit'

// Paywall: :paykit owns the UI and reads its remote config through the vendor-free
// PaywallConfigSource; the billing engine lives in :billingkit, the Firebase source in
// :suite-firebase.
include ':paykit'

// Scenario proof, never published: :billingkit + :paykit with no :ads on the classpath must
// compile and package. If this module breaks, the billing split has regressed.
include ':sample-paywall-only'
