plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'maven-publish'
}

android {
    namespace 'io.paykit.firebase'
    compileSdk compile_sdk_version

    defaultConfig {
        minSdk min_sdk_version
        consumerProguardFiles "consumer-rules.pro"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
        }
    }
}

// One vendor per source module: this one owns Firebase Remote Config and nothing else, so
// :paykit stays on the vendor-free PaywallConfigSource contract.
dependencies {
    api project(':paykit')

    // The BOM is exported so a consumer that adds this source gets its other Firebase artifacts
    // aligned to the same train.
    api platform("com.google.firebase:firebase-bom:$firebase_bom_version")
    api 'com.google.firebase:firebase-config'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.13'
    testImplementation 'androidx.test:core:1.6.1'
}

afterEvaluate {
    publishing {
        publications {
            create("release", MavenPublication) {
                from(components["release"])
                artifactId = "paykit-firebase"
            }
        }
    }
}
