plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'kotlin-parcelize'
    id 'maven-publish'
}

android {
    namespace 'io.onboardkit'
    compileSdk compile_sdk_version

    // AGP fails the build on any resource missing this prefix — collision guard for library consumers
    resourcePrefix 'ob_'

    defaultConfig {
        minSdk min_sdk_version

        buildConfigField "String", "SDK_VERSION", "\"1.0.0\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += ["-Xskip-metadata-version-check"]
    }
    buildFeatures {
        viewBinding = true
        buildConfig = true
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
        }
    }
}

dependencies {
    implementation "androidx.core:core-ktx:$androidx_core_ktx_version"
    implementation "androidx.appcompat:appcompat:$androidx_appcompat_version"
    implementation "com.google.android.material:material:$androidx_material_version"
    implementation "androidx.recyclerview:recyclerview:$androidx_recyclerview_version"
    implementation "androidx.viewpager2:viewpager2:1.1.0"
    implementation "androidx.fragment:fragment-ktx:$androidx_fragment_ktx_version"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$androidx_lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-process:$androidx_lifecycle_version"

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutines_version"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3"
    implementation "androidx.datastore:datastore:1.2.1"

    implementation platform("com.google.firebase:firebase-bom:$firebase_bom_version")
    implementation "com.google.firebase:firebase-config"

    implementation "com.github.bumptech.glide:glide:$glide_version"
    implementation "androidx.media3:media3-exoplayer:$media3_exoplayer_version"
    implementation "androidx.media3:media3-ui:$media3_ui_version"
    implementation "androidx.media3:media3-datasource:$media3_exoplayer_version"

    // api, not implementation: partner AnalyticsPlugins and sinks talk to Tracker/TrackkitEvents
    api project(':trackkit')

    // Default ad provider bridges to the project's ads module; apps may inject their own provider instead
    implementation project(':ads')
    implementation "com.google.android.gms:play-services-ads:$play_services_ads_version"

    testImplementation 'junit:junit:4.13.2'
    // View-level tests (ConfirmAdSlot re-parents a bound ad between dialogs); same versions :ads uses.
    testImplementation 'org.robolectric:robolectric:4.13'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:$coroutines_version"
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
}

// AGP creates the 'release' software component late, so the publication must be configured
// inside afterEvaluate. groupId and version are inherited from the root project, which means
// the project(':ads') dependency resolves to com.github.truongvimit:ads:<same version> in the POM.
afterEvaluate {
    publishing {
        publications {
            create("release", MavenPublication) {
                from(components["release"])
                artifactId = "onboardkitorigin"
            }
        }
    }
}
